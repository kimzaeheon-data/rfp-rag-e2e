<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3525cd" />
    <meta name="description" content="RFPilot - AI Proposal Assistant" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>RFPilot</title>

    <!-- Tailwind (CDN) + 폰트/아이콘 : 새 디자인용 -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f9f9ff; }
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
      .chat-container-scroll::-webkit-scrollbar { width: 6px; }
      .chat-container-scroll::-webkit-scrollbar-track { background: transparent; }
      .chat-container-scroll::-webkit-scrollbar-thumb { background: #dce2f7; border-radius: 10px; }
      .shadow-soft { box-shadow: 0 4px 20px -2px rgba(53, 37, 205, 0.05); }
      .active-tab-indicator { position: relative; }
      .active-tab-indicator::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 3px; background: #3525cd; border-radius: 3px 3px 0 0; }
    </style>
    <script>
      tailwind.config = {
        theme: { extend: {
          colors: {
            "primary": "#3525cd", "primary-container": "#4f46e5",
            "on-surface": "#141b2b", "on-surface-variant": "#464555",
            "outline": "#777587", "outline-variant": "#c7c4d8",
            "background": "#f9f9ff", "surface": "#f9f9ff",
            "surface-container": "#e9edff", "surface-container-low": "#f1f3ff",
            "surface-container-lowest": "#ffffff", "surface-container-highest": "#dce2f7",
          },
          borderRadius: { "DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px" }
        } }
      }
    </script>
  </head>
  <body class="bg-background text-on-surface">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
